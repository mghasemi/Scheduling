[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduling-toolkit"
version = "0.1.0"
description = "Tools for resource-constrained task scheduling and simulation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
optimization = ["pyomo>=6.7"]
simulation = ["numpy>=1.23", "scipy>=1.9", "joblib>=1.2"]
visualization = ["matplotlib>=3.6"]
data = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.5"]
pcb = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "joblib>=1.2",
    "pyomo>=6.7",
    "matplotlib>=3.6",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]
dev = [
    "build>=1.0",
    "pytest>=7.4",
    "ruff>=0.4",
    "sphinx>=7.2",
]

[tool.setuptools.packages.find]
include = ["scheduling*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
